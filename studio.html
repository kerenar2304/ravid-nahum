<script id="src" type="text/plain">
const { useState, useRef, useEffect, useLayoutEffect } = React;

/* ---------------------------------------------------------------
   Ravid Nahum — shared pieces: tokens, hooks, icons, header, footer
   --------------------------------------------------------------- */

const cn = (...a: (string | false | null | undefined)[]) => a.filter(Boolean).join(" ");

const ROUTES = {

  projects: "projects.html",
  studio: "studio.html",
  about: "studio.html",
  contact: "./#contact",
  accessibility: "/accessibility",

};

};

/* ---------- desktop fluid scale ----------
   The Figma frame is 1325px wide. From 1024px up the whole page is zoomed so the
   frame fills the screen; above 1325px growth is damped (60%) and capped at 1.6.
   Below 1024px there is no zoom and the responsive (mobile/tablet) layout applies. */
const DESIGN_W = 1325;
function fluidZoom(w: number) {
  if (w < 1024) return 1;
  if (w <= DESIGN_W) return w / DESIGN_W;
  return Math.min(1.6, 1 + (w / DESIGN_W - 1) * 0.6);
}
function useFluidScale() {
  useLayoutEffect(() => {
    const apply = () => {
      const r = document.documentElement;
      (r.style as CSSStyleDeclaration & { zoom: string }).zoom = ""; // measure without zoom, minus the scrollbar
      const z = fluidZoom(r.clientWidth || window.innerWidth);
      (r.style as CSSStyleDeclaration & { zoom: string }).zoom = z === 1 ? "" : z.toFixed(4);
      r.style.setProperty("--z", z.toFixed(4));
    };
    apply();
    window.addEventListener("resize", apply);
    return () => window.removeEventListener("resize", apply);
  }, []);
}

const reducedMotion = () =>
  typeof window !== "undefined" && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* Viewport height in the same units getBoundingClientRect() reports (zoom-safe),
   and the factor that turns those units into window scroll pixels. */
let probe: HTMLDivElement | null = null;
function viewport() {
  if (!probe) {
    probe = document.createElement("div");
    probe.setAttribute("aria-hidden", "true");
    probe.style.cssText = "position:fixed;top:0;left:0;width:0;height:100%;pointer-events:none;visibility:hidden";
    document.body.appendChild(probe);
  }
  const h = probe.getBoundingClientRect().height || window.innerHeight;
  return { h, toScroll: window.innerHeight / h };
}

/* Runs `cb` once per animation frame while the page scrolls or resizes. */
function useScrollFrame(cb: () => void, deps: unknown[] = []) {
  useEffect(() => {
    let raf = 0;
    const tick = () => { raf = 0; cb(); };
    const req = () => { if (!raf) raf = requestAnimationFrame(tick); };
    tick();
    window.addEventListener("scroll", req, { passive: true });
    window.addEventListener("resize", req);
    return () => {
      window.removeEventListener("scroll", req);
      window.removeEventListener("resize", req);
      if (raf) cancelAnimationFrame(raf);
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, deps);
}

/* Adds .is-in to every [data-reveal] element once it scrolls into view. */
function useReveal(deps: unknown[] = []) {
  useEffect(() => {
    const els = Array.from(document.querySelectorAll<HTMLElement>("[data-reveal]:not(.is-in)"));
    if (reducedMotion() || !("IntersectionObserver" in window)) {
      els.forEach((el) => el.classList.add("is-in"));
      return;
    }
    const io = new IntersectionObserver(
      (entries) => entries.forEach((e) => {
        if (e.isIntersecting) { e.target.classList.add("is-in"); io.unobserve(e.target); }
      }),
      { threshold: 0.12, rootMargin: "0px 0px -6% 0px" },
    );
    els.forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, deps); // eslint-disable-line react-hooks/exhaustive-deps
}

const clamp01 = (v: number) => Math.min(1, Math.max(0, v));
const easeOut = (t: number) => 1 - Math.pow(1 - t, 3);

/* ---------- icons ---------- */
type IconProps = SVGProps<SVGSVGElement>;
const PhoneIcon = (p: IconProps) => (
  <svg viewBox="0 0 22 22" fill="currentColor" aria-hidden="true" {...p}>

  </svg>
);

/* ---------- loader: the logo mark plays tetris — four pieces drop into a 4×4 block, then the curtain lifts.
   Drawn as vector (the exact logo mark), so it stays sharp at any size. ---------- */
const MARK_D = "M135.379,133.544l-.045,432.867,429.333.044V133.588l-429.288-.044ZM537.216,528.632c6.477-7.292,11.732-15.31,16.579-25.321l.091,52.183h-52.409c13.544-6.16,25.729-15.266,35.74-26.862ZM533.094,144.55l20.746-.181v318.718l-174.306-318.536h153.56ZM146.204,144.506l205.018.044,13.952-.226v369.813l-29.308-25.774-45.751-45.479c-19.07-18.935-41.221-39.864-65.818-52.681l61.741-.228c21.29-.091,41.493-11.641,54.041-30.983,13.091-20.158,15.356-46.205,5.889-67.947-11.279-25.774-35.65-41.494-63.825-41.087h-135.939v-105.453ZM146.25,260.83h140.877c30.349,2.176,53.768,27.679,53.768,58.255v1.042c-.588,33.248-25.865,59.113-57.664,59.113h-137.026l.045-118.409ZM146.25,555.494l-.045-165.384,34.834.046c10.963-.407,21.698,1.902,32.751,7.067,27.994,13.001,50.915,35.738,73.066,57.799l40.995,40.724c10.826,10.736,21.743,20.338,34.336,30.258,16.941,13.229,33.158,23.012,48.967,29.49H146.25ZM435.704,551.825c-11.687-2.581-23.011-6.93-35.695-13.724-9.603-5.209-14.858-8.29-23.872-14.994l.045-363.788,173.989,318.806c-.498,5.3-1.631,10.057-3.579,14.857-18.255,45.298-63.87,69.489-110.889,58.843Z";
/* [row, col] cells of each piece, in the order they fall */
const PIECES: [number, number][][] = [
  [[3, 0], [3, 1], [3, 2], [3, 3]],   // I
  [[0, 0], [1, 0], [2, 0], [2, 1]],   // L
  [[1, 2], [1, 3], [2, 2], [2, 3]],   // O
  [[0, 1], [0, 2], [0, 3], [1, 1]],   // J
];
const CELL = 100, GAP = 10, STEP = CELL + GAP; // in viewBox units

/* plays when the site is entered or reloaded, not when moving between its pages */
function loaderWanted() {
  if (reducedMotion()) return false;
  try {
    const nav = performance.getEntriesByType("navigation")[0] as PerformanceNavigationTiming | undefined;
    const reload = nav?.type === "reload";
    const seen = sessionStorage.getItem("rn-entered") === "1";
    sessionStorage.setItem("rn-entered", "1");
    return reload || !seen;
  } catch {
    return true;
  }
}

function Loader() {
  const [state, setState] = useState<"on" | "leaving" | "off">(() => (loaderWanted() ? "on" : "off"));
  useEffect(() => {
    if (state === "off") { document.documentElement.classList.remove("is-loading"); return; }
    if (state !== "on") return;
    document.documentElement.classList.add("is-loading");
    document.documentElement.style.overflow = "hidden";
    const done = window.setTimeout(() => setState("leaving"), 2900); // pieces land by ~2.1s, a short hold, then lift
    return () => window.clearTimeout(done);
  }, [state]);
  useEffect(() => {
    if (state !== "leaving") return;
    document.documentElement.classList.remove("is-loading"); // hero animations start as the curtain lifts
    document.documentElement.style.overflow = "";
    const t = window.setTimeout(() => setState("off"), 700);
    return () => window.clearTimeout(t);
  }, [state]);
  if (state === "off") return null;
  const size = 4 * STEP - GAP;
  return (
    <div
      aria-hidden="true"
      className={cn("fixed inset-0 z-[100] flex items-center justify-center bg-[#0c2e2e] transition-opacity duration-700", state === "leaving" && "pointer-events-none opacity-0")}
    >
      <svg viewBox={`0 0 ${size} ${size}`} className="h-[clamp(150px,26vmin,260px)] w-auto overflow-visible" shapeRendering="geometricPrecision">
        <defs>
          <symbol id="rn-mark" viewBox="135.3 133.5 429.4 433">
            <path d={MARK_D} fill="#e0e0cf" />
          </symbol>
        </defs>
        {PIECES.map((cells, i) => (
          <g key={i} className="rn-piece" style={{ animationDelay: `${120 + i * 480}ms` }}>
            {cells.map(([r, c]) => (
              <use key={`${r}-${c}`} href="#rn-mark" x={c * STEP} y={r * STEP} width={CELL} height={CELL} />
            ))}
          </g>
        ))}
      </svg>
    </div>
  );
}


/* ---------- animated headline text ---------- */
/* Letters turn on their vertical axis like shutter slats: in on load, out on scroll */
function FlipText({ text, className, delay = 0 }: { text: string; className?: string; delay?: number }) {
  const n = Array.from(text).length;
  let i = 0;
  // letters animate one by one, but each word stays unbroken so lines only wrap between words
  return (
    <span className={className} aria-label={text}>
      {text.split(" ").map((word, w) => (
        <span key={w}>
          {w > 0 && " "}
          <span className="inline-block whitespace-nowrap" aria-hidden="true">
            {Array.from(word).map((ch) => {
              const k = i++;
              return (
                <span key={k} className="rn-flip" style={{ animationDelay: `${delay + k * 45}ms`, ["--i" as string]: k, ["--n" as string]: n } as CSSProperties}>
                  <span>{ch}</span>
                </span>
              );
            })}
          </span>
        </span>
      ))}
    </span>
  );
}

/* A rule drawn by the scroll itself, from its own edge, as soon as it enters the screen */
function ScrollRule({ className, from = "left" }: { className: string; from?: "left" | "right" }) {
  const ref = useRef<HTMLSpanElement>(null);
  useScrollFrame(() => {
    const el = ref.current;
    if (!el) return;
    if (reducedMotion()) { el.style.transform = "none"; return; }
    const { h } = viewport();
    const top = el.getBoundingClientRect().top;
    el.style.transform = `scaleX(${easeOut(clamp01((h * 1.05 - top) / (h * 0.75)))})`;
  });
  return <span ref={ref} aria-hidden="true" className={cn("block scale-x-0 bg-stone will-change-transform", from === "left" ? "origin-left" : "origin-right", className)} />;
}

/* One stage at a time. The section pins; each new card slides in from the side and covers the
   previous one, which settles back. Once a card is in place its drawing is sketched by the scroll. */
function Stages() {
  const wrapRef = useRef<HTMLDivElement>(null);
  const stickRef = useRef<HTMLDivElement>(null);
  const deckRef = useRef<HTMLOListElement>(null);

  useEffect(() => {
    const wrap = wrapRef.current, stick = stickRef.current, deck = deckRef.current;
    if (!wrap || !stick || !deck) return;
    const cards = Array.from(deck.children) as HTMLElement[];
    const N = cards.length;
    const paths = cards.map((c) => Array.from(c.querySelectorAll<SVGPathElement>("svg path")));
    // drawings are sketched in time (not scrubbed) as soon as their card arrives
    paths.forEach((list) => list.forEach((p, j) => {
      const delay = `${j * 70}ms`;
      if (p.classList.contains("d")) { p.style.opacity = "0"; p.style.transition = `opacity .9s ease ${delay}`; }
      else { p.style.strokeDasharray = "1"; p.style.strokeDashoffset = "1"; p.style.transition = `stroke-dashoffset 1.5s cubic-bezier(.45,0,.25,1) ${delay}`; }
    }));
    const drawn = cards.map(() => false);
    const setDrawn = (i: number, on: boolean) => {
      if (drawn[i] === on) return;
      drawn[i] = on;
      paths[i].forEach((p) => {
        if (p.classList.contains("d")) p.style.opacity = on ? "0.6" : "0";
        else p.style.strokeDashoffset = on ? "0" : "1";
      });
    };
    let cur = 0, target = 0, raf = 0, entered = false;

    const paint = () => {
      const q = cur * N; // 0..N, one unit of scroll per stage
      cards.forEach((card, i) => {
        const local = q - i; // <0 not yet, 0..1 this stage, >1 covered
        const enter = i === 0 ? 1 : clamp01(local / 0.75);
        const e = enter < 0.5 ? 4 * enter ** 3 : 1 - Math.pow(-2 * enter + 2, 3) / 2; // ease in-out
        const covered = clamp01((local - 1) / 0.5);
        card.style.transform = `translate3d(${(e - 1) * 112}%, 0, 0) scale(${1 - covered * 0.03})`;
        setDrawn(i, reducedMotion() || (i === 0 ? entered : local > 0.42));
      });
    };
    const loop = () => {
      cur += (target - cur) * (reducedMotion() ? 1 : 0.06);
      paint();
      raf = Math.abs(target - cur) > 0.0004 ? requestAnimationFrame(loop) : 0;
    };
    const read = () => {
      const w = wrap.getBoundingClientRect(), s = stick.getBoundingClientRect();
      target = clamp01((s.top - w.top) / (w.height - s.height || 1)) * ((N - 0.05) / N);
      entered = w.top < viewport().h * 0.3;
      if (!raf) raf = requestAnimationFrame(loop);
    };
    read(); paint();
    window.addEventListener("scroll", read, { passive: true });
    window.addEventListener("resize", read);
    return () => { window.removeEventListener("scroll", read); window.removeEventListener("resize", read); cancelAnimationFrame(raf); };
  }, []);

  return (
    <section aria-labelledby="stages-title" className="relative pb-20 pt-24 text-stone lg:pb-[150px] lg:pt-[150px]">

/* The opening layers stay put once their bottom reaches the screen edge,
   so the terracotta arch rises over them and covers them. */
function CoveredLayer({ children }: { children: ReactNode }) {
  const ref = useRef<HTMLDivElement>(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const fit = () => {
      const z = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--z")) || 1;
      el.style.top = `${Math.min(0, window.innerHeight / z - el.offsetHeight)}px`;
    };
    fit();
    const ro = new ResizeObserver(fit);
    ro.observe(el);
    window.addEventListener("resize", fit);
    return () => { ro.disconnect(); window.removeEventListener("resize", fit); };
  }, []);
  return <div ref={ref} className="sticky pb-[30vh] lg:pb-[12vh]">{children}</div>;
}

/* ------------------------------------------------- TERRA (arch wrapper) */
const ARCH_TEXT = "בתים שנבנו בשפה אחת · מבחוץ פנימה · ומבפנים החוצה";
const ARCH_TEXT_SHORT = "מבחוץ פנימה · ומבפנים החוצה";

function TerraArch() {
  const ref = useRef<HTMLDivElement>(null);
  const svgRef = useRef<SVGSVGElement>(null);
  const pathRef = useRef<SVGPathElement>(null);
  const textRef = useRef<SVGTextElement>(null);

  // The arch rises as a narrow dome and opens to full width; the curved line of text
  // rides its rim, growing and spreading out as it opens. Eased with a soft follow.
  useEffect(() => {
    const el = ref.current, svg = svgRef.current, path = pathRef.current, text = textRef.current;
    if (!el || !svg || !path || !text) return;
    let cur = -1, target = 0, raf = 0;

    const paint = () => {
      const W = el.offsetWidth;
      const p = easeOut(cur);
      const x = (1 - p) * W * 0.32;
      const r = (W - 2 * x) / 2;
      el.style.clipPath = `inset(0px ${x}px 0px ${x}px round ${r}px ${r}px 0px 0px)`;

      // text circle sits just inside the rim
      const cx = W / 2, cy = r, rr = r * 0.9;
      const a = (16 * Math.PI) / 180;
      const x1 = cx - rr * Math.cos(a), x2 = cx + rr * Math.cos(a), y = cy - rr * Math.sin(a);
      svg.setAttribute("viewBox", `0 0 ${W} ${r}`);
      svg.style.height = `${r}px`;
      path.setAttribute("d", `M ${x1} ${y} A ${rr} ${rr} 0 0 1 ${x2} ${y}`);
      const fs = 13 + p * (W >= 1000 ? 13 : 5);
      text.style.fontSize = `${fs}px`;
      text.style.letterSpacing = `${0.05 + p * 0.5}em`;
      text.style.opacity = String(clamp01(p * 1.6));
      // never longer than the rim: shorter phrase on narrow screens, then shrink to fit
      const tp = text.firstElementChild as SVGTextPathElement | null;
      const phrase = W < 640 ? ARCH_TEXT_SHORT : ARCH_TEXT;
      if (tp && tp.textContent !== phrase) tp.textContent = phrase;
      const room = path.getTotalLength() * 0.92, used = text.getComputedTextLength();
      if (used > room && used > 0) text.style.fontSize = `${fs * room / used}px`;
    };
    const loop = () => {
      cur += (target - cur) * (reducedMotion() ? 1 : 0.09);
      paint();
      raf = Math.abs(target - cur) > 0.0005 ? requestAnimationFrame(loop) : 0;
    };
    const read = () => {
      const { h } = viewport();
      const top = el.getBoundingClientRect().top;
      target = reducedMotion() ? 1 : clamp01((h - top) / (h * 0.9));
      if (cur < 0) cur = target;
      if (!raf) raf = requestAnimationFrame(loop);
    };
    read();
    window.addEventListener("scroll", read, { passive: true });
    window.addEventListener("resize", read);
    return () => { window.removeEventListener("scroll", read); window.removeEventListener("resize", read); cancelAnimationFrame(raf); };
  }, []);

  return (
    <div ref={ref} className="relative z-10 mt-[55vh] bg-terra lg:mt-[calc(153px+38vh/var(--z))]" style={{ clipPath: "inset(0 round 50vw 50vw 0 0)" }}>
      <svg ref={svgRef} aria-hidden="true" className="pointer-events-none absolute inset-x-0 top-0 w-full overflow-visible">
        <path ref={pathRef} id="arch-text-path" fill="none" />
        <text ref={textRef} fill="#e0e0cf" className="font-light" direction="rtl">
          <textPath href="#arch-text-path" startOffset="50%" textAnchor="middle">{ARCH_TEXT}</textPath>
        </text>
      </svg>
      <Projects />
      <Stages />
      <Partners />
    </div>
  );
}

/* a number that counts up once it scrolls into view */
function CountUp({ to, suffix = "" }: { to: number; suffix?: string }) {
  const ref = useRef<HTMLSpanElement>(null);
  const [n, setN] = useState(reducedMotion() ? to : 0);
  useEffect(() => {
    const el = ref.current;
    if (!el || reducedMotion()) return;
    const from = to > 1000 ? to - 40 : 0;
    const io = new IntersectionObserver(([e]) => {
      if (!e.isIntersecting) return;
      io.disconnect();
      const t0 = performance.now(), dur = 1600;
      const step = (t: number) => {
        const p = Math.min(1, (t - t0) / dur);
        setN(Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3))));
        if (p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }, { threshold: 0.4 });
    io.observe(el);
    return () => io.disconnect();
  }, [to]);
  return <span ref={ref} className="font-['Num']" dir="ltr">{n}{suffix}</span>;
}

/* ===============================================================
   Ravid Nahum — a single project
   The story runs from outside to inside: the exterior first,
   then an arched window opens in the facade onto the interior.

   =============================================================== */

/* which project: /projects/<slug> in the app, ?slug=<slug> in the static preview */
function currentProject(): Project {
  const q = new URLSearchParams(window.location.search).get("slug");
  const fromPath = window.location.pathname.split("/").filter(Boolean).pop();
  return PROJECTS.find((p) => p.slug === q) ?? PROJECTS.find((p) => p.slug === fromPath) ?? PROJECTS[0];
}

const KIND: Record<Project["kind"], string> = { private: "בית פרטי", apartment: "דירה", commercial: "מסחרי" };

/* a photo that eases in when it scrolls into view; `pos` picks the crop */
function Shot({ src, alt, pos = "50% 50%", className }: { src: string; alt: string; pos?: string; className?: string }) {
  return (
    <figure data-reveal="unveil" className={cn("relative overflow-hidden", className)}>
      <span className="rn-clip absolute inset-0 block overflow-hidden">
        <img src={src} alt={alt} loading="lazy" className="rn-front absolute inset-0 h-full w-full object-cover" style={{ objectPosition: pos }} />
      </span>
    </figure>
  );
}

/* the threshold: an arched window opens in the exterior and grows until the interior fills the screen */
function Threshold({ p }: { p: Project }) {
  const s = shots(p.slug);
  const wrapRef = useRef<HTMLDivElement>(null);
  const winRef = useRef<HTMLDivElement>(null);
  const labelRef = useRef<HTMLParagraphElement>(null);
  useScrollFrame(() => {
    const wrap = wrapRef.current, win = winRef.current, label = labelRef.current;
    if (!wrap || !win || !label) return;
    const { h } = viewport();
    const r = wrap.getBoundingClientRect();
    const t = reducedMotion() ? 1 : easeOut(clamp01(-r.top / (r.height - h)));
    const W = win.offsetWidth, H = win.offsetHeight;
    const w = W * (0.34 + 0.66 * t), hh = H * (0.6 + 0.4 * t);
    const x = (W - w) / 2, bottom = H * 0.1 * (1 - t), top = H - bottom - hh;
    const rad = (w / 2) * (1 - t);
    win.style.clipPath = `inset(${top}px ${x}px ${bottom}px ${x}px round ${rad}px ${rad}px 0 0)`;
    label.style.opacity = String(1 - clamp01(t * 2.2));
  });
  return (
    <section ref={wrapRef} aria-label="מבחוץ פנימה" className="relative" style={{ height: "calc(230vh / var(--z))" }}>
      <div className="sticky top-0 overflow-hidden" style={{ height: "calc(100vh / var(--z))" }}>
        <img src={s.extHero} alt="" aria-hidden="true" className="absolute inset-0 h-full w-full object-cover" />
        <span aria-hidden="true" className="absolute inset-0 bg-petrol/35" />
        <div ref={winRef} className="absolute inset-0" style={{ clipPath: "inset(40% 33% 10% 33% round 200px 200px 0 0)" }}>
          <img src={s.intHero} alt={`${p.name}, מבט מבפנים`} className="absolute inset-0 h-full w-full object-cover" />
        </div>
        <p ref={labelRef} className="t-2 absolute inset-x-0 top-[14%] text-center font-light text-stone">מבחוץ פנימה</p>
      </div>
    </section>
  );
}
